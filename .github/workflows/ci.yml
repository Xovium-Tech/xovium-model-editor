name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mode: [desktop, headless]
    env:
      XOVIUM_BUILD_DIR: ${{ github.workspace }}/.build/ci-${{ matrix.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install common build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git python3 pkg-config libassimp-dev libpng-dev libtinyxml2-dev libarchive-dev
      - name: Install desktop build dependencies
        if: matrix.mode == 'desktop'
        run: sudo apt-get install -y --no-install-recommends libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - name: Check build scripts
        run: |
          bash -n build.sh run.sh tools/build-state.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for source in Path('tools').rglob('*.py'):
              ast.parse(source.read_text(), filename=str(source))
          PY
      - name: Build desktop editor and native tools
        if: matrix.mode == 'desktop'
        run: ./build.sh
      - name: Build native tools without desktop libraries
        if: matrix.mode == 'headless'
        run: ./build.sh --backend-only
      - name: Check native command line
        run: |
          "$XOVIUM_BUILD_DIR/xovium-model-tool" --root "$GITHUB_WORKSPACE" --help
          "$XOVIUM_BUILD_DIR/xovium-model-tool" --version
      - name: Import, save and export a portable project
        run: |
          smoke_dir="$(dirname "$GITHUB_WORKSPACE")/xov-tests/model-editor-cpp-ci"
          mkdir -p "$smoke_dir"
          cat > "$smoke_dir/triangle.obj" <<'OBJ'
          o triangle
          v 0 0 0
          v 1 0 0
          v 0 1 0
          f 1 2 3
          OBJ
          export XOVIUM_MESH_IMPORT="$XOVIUM_BUILD_DIR/mesh-import"
          tool="$XOVIUM_BUILD_DIR/xovium-model-tool"
          "$tool" --root "$GITHUB_WORKSPACE" new --workspace "$smoke_dir/workspace" --name CI --vehicle custom
          "$tool" --root "$GITHUB_WORKSPACE" import "$smoke_dir/triangle.obj" --workspace "$smoke_dir/workspace"
          "$tool" --root "$GITHUB_WORKSPACE" validate --workspace "$smoke_dir/workspace"
          "$tool" --root "$GITHUB_WORKSPACE" save --workspace "$smoke_dir/workspace" --output "$smoke_dir/ci.xovmodel"
          "$tool" --root "$GITHUB_WORKSPACE" import "$smoke_dir/ci.xovmodel" --workspace "$smoke_dir/reopened"
          "$tool" --root "$GITHUB_WORKSPACE" export --workspace "$smoke_dir/reopened" --target gazebo --output "$smoke_dir/gazebo"
